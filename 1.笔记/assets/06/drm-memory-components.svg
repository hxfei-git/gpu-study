<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
<title id="title">一个普通 GTT BO 的创建、后端调用与 GPUVM 映射</title><desc id="desc">两排逻辑流程图，上排从AMDGPU创建对象到GEM和TTM初始化，下排从已登记后端到system RAM页面再到后续GPUVM映射。虚线表示后续映射请求使用同一BO。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#365874"/></marker></defs>
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#16324a;font-size:19px}.title{font-size:27px;font-weight:600}.small{font-size:17px;fill:#415b70}.head{font-size:21px;font-weight:600}.edge{fill:none;stroke:#365874;stroke-width:2;marker-end:url(#arrow)}.later{fill:none;stroke:#6a6ab8;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
<rect width="1080" height="760" fill="white"/>
<text class="title" x="28" y="42">一个普通 GTT BO 的创建、后端调用与 GPUVM 映射</text>
<text x="28" y="76" class="small">本例：全新普通 GTT BO，后备页面在 system RAM；实线为创建或后端调用，虚线为后续使用。</text>
<rect x="16" y="155" width="250" height="130" rx="10" fill="#eef5fa" stroke="#7898b0" stroke-width="1.5"/>
<text x="141.0" y="197.0" text-anchor="middle" class="head">AMDGPU 内存后端</text>
<text x="141.0" y="227.0" text-anchor="middle" class="">缓冲大小与</text>
<text x="141.0" y="257.0" text-anchor="middle" class="">GTT 放置要求</text>
<rect x="282" y="155" width="250" height="130" rx="10" fill="#edf7f1" stroke="#7898b0" stroke-width="1.5"/>
<text x="407.0" y="197.0" text-anchor="middle" class="head">amdgpu_bo_create</text>
<text x="407.0" y="227.0" text-anchor="middle" class="">创建 AMDGPU BO</text>
<text x="407.0" y="257.0" text-anchor="middle" class="">管理记录</text>
<rect x="548" y="155" width="250" height="130" rx="10" fill="#fff4e7" stroke="#7898b0" stroke-width="1.5"/>
<text x="673.0" y="197.0" text-anchor="middle" class="head">内嵌 GEM 对象</text>
<text x="673.0" y="227.0" text-anchor="middle" class="">tbo.base</text>
<text x="673.0" y="257.0" text-anchor="middle" class="">通用缓冲对象身份</text>
<rect x="814" y="155" width="250" height="130" rx="10" fill="#fff4e7" stroke="#7898b0" stroke-width="1.5"/>
<text x="939.0" y="197.0" text-anchor="middle" class="head">内嵌 TTM 对象</text>
<text x="939.0" y="227.0" text-anchor="middle" class="">tbo</text>
<text x="939.0" y="257.0" text-anchor="middle" class="">接收 bo.placement</text>
<rect x="814" y="475" width="250" height="130" rx="10" fill="#fff4e7" stroke="#7898b0" stroke-width="1.5"/>
<text x="939.0" y="517.0" text-anchor="middle" class="head">设备的 TTM 实现表</text>
<text x="939.0" y="547.0" text-anchor="middle" class="">bdev.funcs</text>
<text x="939.0" y="577.0" text-anchor="middle" class="">已登记 AMDGPU 后端</text>
<rect x="548" y="475" width="250" height="130" rx="10" fill="#eef5fa" stroke="#7898b0" stroke-width="1.5"/>
<text x="673.0" y="517.0" text-anchor="middle" class="head">普通 GTT 后备页面</text>
<text x="673.0" y="547.0" text-anchor="middle" class="">system RAM 页面</text>
<text x="673.0" y="577.0" text-anchor="middle" class="">及设备 DMA 地址</text>
<rect x="282" y="475" width="250" height="130" rx="10" fill="#edf7f1" stroke="#7898b0" stroke-width="1.5"/>
<text x="407.0" y="517.0" text-anchor="middle" class="head">AMDGPU GPUVM</text>
<text x="407.0" y="547.0" text-anchor="middle" class="">P 的 GPUVA 范围</text>
<text x="407.0" y="577.0" text-anchor="middle" class="">与同一 BO 的关联</text>
<rect x="16" y="475" width="250" height="130" rx="10" fill="#edf7f1" stroke="#7898b0" stroke-width="1.5"/>
<text x="141.0" y="517.0" text-anchor="middle" class="head">页表更新并同步</text>
<text x="141.0" y="547.0" text-anchor="middle" class="">MI300X 使用 GPUVA</text>
<text x="141.0" y="577.0" text-anchor="middle" class="">访问对应页面</text>
<path class="edge" d="M266 220 H282"/>
<rect x="181.5" y="110" width="185" height="34" rx="5" fill="white"/>
<text x="274" y="132" text-anchor="middle" class="small" style="fill:#16324a">调用创建函数</text>
<path class="edge" d="M532 220 H548"/>
<rect x="432.5" y="110" width="215" height="34" rx="5" fill="white"/>
<text x="540" y="132" text-anchor="middle" class="small" style="fill:#16324a">调用 GEM 初始化</text>
<path class="edge" d="M798 220 H814"/>
<rect x="698.5" y="110" width="215" height="34" rx="5" fill="white"/>
<text x="806" y="132" text-anchor="middle" class="small" style="fill:#16324a">创建函数继续调用 TTM</text>
<path class="edge" d="M939 285 V475"/>
<rect x="836.5" y="358" width="205" height="60" rx="5" fill="white"/>
<text x="939" y="380" text-anchor="middle" class="small" style="fill:#16324a">沿 bdev.funcs</text>
<text x="939" y="406" text-anchor="middle" class="small" style="fill:#16324a">选择设备后端</text>
<path class="edge" d="M814 540 H798"/>
<rect x="676.0" y="624" width="260" height="60" rx="5" fill="white"/>
<text x="806" y="646" text-anchor="middle" class="small" style="fill:#16324a">需要填充系统页面时</text>
<text x="806" y="672" text-anchor="middle" class="small" style="fill:#16324a">调用 AMDGPU 后端</text>
<path class="edge" d="M548 540 H532"/>
<rect x="425.0" y="624" width="230" height="60" rx="5" fill="white"/>
<text x="540" y="646" text-anchor="middle" class="small" style="fill:#16324a">使用当前存储</text>
<text x="540" y="672" text-anchor="middle" class="small" style="fill:#16324a">和设备 DMA 地址</text>
<path class="edge" d="M282 540 H266"/>
<rect x="169.0" y="624" width="210" height="60" rx="5" fill="white"/>
<text x="274" y="646" text-anchor="middle" class="small" style="fill:#16324a">记录映射</text>
<text x="274" y="672" text-anchor="middle" class="small" style="fill:#16324a">更新页表并同步</text>
<path class="later" d="M407 285 V475"/>
<rect x="292.0" y="358" width="230" height="60" rx="5" fill="white"/>
<text x="407" y="380" text-anchor="middle" class="small" style="fill:#5f5fa0">后续映射请求</text>
<text x="407" y="406" text-anchor="middle" class="small" style="fill:#5f5fa0">使用同一份 BO</text>
<text x="28" y="731" class="small">BO 创建先交付存储管理对象；P 的 GPUVA 映射与设备访问条件由后续请求完成。</text>
</svg>
