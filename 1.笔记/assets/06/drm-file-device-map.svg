<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="810" viewBox="0 0 1060 810" role="img" aria-labelledby="title desc">
  <title id="title">P 的文件、DRM 记录、AMDGPU 私有状态与设备关联</title>
  <desc id="desc">进程 P 的 fd 7 指向 render 打开文件。其 private_data 指向 DRM 文件，driver_priv 指向 AMDGPU 私有记录及 GPUVM。DRM 文件还通过 minor 找到 render 节点与设备实现表。PDD 保留同一 render 打开文件的引用。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#365874"/></marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #16324a; font-size: 21px; }
    .title { font-size: 27px; font-weight: 600; }
    .head { font-size: 23px; font-weight: 600; }
    .small { font-size: 18px; fill: #415b70; }
    .box { fill: #f0f6fa; stroke: #7898b0; stroke-width: 1.5; rx: 9; }
    .user { fill: #f4f4f4; stroke: #87939c; stroke-width: 1.5; rx: 9; }
    .kfd { fill: #fff4e7; stroke: #b79971; stroke-width: 1.5; rx: 9; }
    .private { fill: #edf7f1; stroke: #7a9d8a; stroke-width: 1.5; rx: 9; }
    .edge { fill: none; stroke: #365874; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1060" height="810" fill="#fff"/>
  <text x="28" y="41" class="title">P 使用同一 render 打开文件，KFD 保留其引用</text>
  <text x="28" y="70" class="small">教学取值：render 编号 128，P 的 fd 7 / 8，GPUVM 的 PASID 42</text>

  <rect class="user" x="28" y="105" width="215" height="138"/>
  <text x="47" y="138" class="head">P 的文件描述符表</text>
  <text x="47" y="177">drm_fd = 7</text>
  <text x="47" y="213">kfd_fd = 8</text>

  <rect class="box" x="315" y="105" width="310" height="138"/>
  <text x="334" y="138" class="head">render 打开文件</text>
  <text x="334" y="175">Linux struct file</text>
  <text x="334" y="213">private_data → DRM 记录</text>

  <rect class="box" x="725" y="105" width="310" height="138"/>
  <text x="744" y="138" class="head">render 节点记录</text>
  <text x="744" y="175">drm_minor：index = 128</text>
  <text x="744" y="213">dev → 当前 DRM 设备</text>

  <rect class="box" x="315" y="340" width="310" height="145"/>
  <text x="334" y="375" class="head">DRM 通用文件记录</text>
  <text x="334" y="410">struct drm_file</text>
  <text x="334" y="443">minor → render 节点</text>
  <text x="334" y="475" class="small">driver_priv → AMDGPU 私有记录</text>

  <rect class="box" x="725" y="340" width="310" height="145"/>
  <text x="744" y="375" class="head">设备公共记录</text>
  <text x="744" y="411">amdgpu_device</text>
  <text x="744" y="445">内嵌 ddev：drm_device</text>
  <text x="744" y="475" class="small">ddev.driver → 驱动实现表</text>

  <rect class="private" x="315" y="588" width="310" height="138"/>
  <text x="334" y="622" class="head">AMDGPU 私有记录</text>
  <text x="334" y="657">amdgpu_fpriv</text>
  <text x="334" y="691">vm：GPUVM，PASID 42</text>

  <rect class="box" x="725" y="588" width="310" height="138"/>
  <text x="744" y="622" class="head">驱动实现表</text>
  <text x="744" y="657">amdgpu_kms_driver</text>
  <text x="744" y="691">open → AMDGPU 回调</text>

  <rect class="kfd" x="28" y="563" width="215" height="163"/>
  <text x="47" y="597" class="head">KFD 的 PDD</text>
  <text x="47" y="632">P 对 GPU0 的记录</text>
  <text x="47" y="666">drm_file →</text>
  <text x="47" y="701">pasid = 42</text>

  <path class="edge" d="M243 170H315"/>
  <text x="263" y="158" class="small">查找</text>
  <path class="edge" d="M80 243V563"/>
  <text x="95" y="337" class="small">使用 /dev/kfd</text>
  <text x="95" y="365" class="small">的计算记录</text>
  <path class="edge" d="M470 243V340"/>
  <text x="481" y="294" class="small">private_data</text>
  <path class="edge" d="M470 485V588"/>
  <text x="481" y="542" class="small">driver_priv</text>
  <path class="edge" d="M625 430H675V180H725"/>
  <text x="648" y="325" class="small">minor</text>
  <path class="edge" d="M880 243V340"/>
  <text x="891" y="294" class="small">dev</text>
  <path class="edge" d="M880 485V588"/>
  <text x="891" y="542" class="small">driver</text>
  <path class="edge" d="M243 666H276V214H315"/>
  <text x="95" y="474" class="small">关联成功后</text>
  <text x="95" y="502" class="small">PDD 保留文件</text>

  <text x="28" y="769" class="small">箭头表示软件查找或引用。图中文件表和管理记录都位于 Host 内核。</text>
  <text x="28" y="798" class="small">PDD.drm_priv 保存通用 drm_file 指针；GPUVM 位于 amdgpu_fpriv.vm 中。</text>
</svg>
