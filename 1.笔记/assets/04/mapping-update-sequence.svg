<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="940" viewBox="0 0 1700 940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#4376b8"/></marker></defs><rect width="1700" height="940" rx="24" fill="#f6f8fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#182b45"><text x="56" y="65" font-size="34" font-weight="700" fill="#172b45">Ring 第一页换页：两条依赖都完成后才恢复访问</text><text x="56" y="108" font-size="23" font-weight="400" fill="#53657f">箭头表示必须先完成的动作；左右分支可以分别准备，不表示固定耗时或一条条独立指令。</text><rect x="56" y="145" width="1588" height="112" rx="16" fill="#edf2fb" stroke="#b8cce5" stroke-width="2"/><text x="82" y="188" font-size="27" font-weight="700" fill="#25364b">前提：暂停对 G 的相关新访问，并等已经发出的旧访问结束</text><text x="82" y="227" font-size="23" font-weight="400" fill="#25364b">P0 与 P1 均保留；旧路径 G → DMA/IOVA 0x1234_5000 → IOMMU → P0；新映射已备好</text><line x1="500" y1="257" x2="500" y2="325" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><line x1="1200" y1="257" x2="1200" y2="325" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><text x="76" y="313" font-size="27" font-weight="700" fill="#254f8d">页表与翻译</text><text x="900" y="313" font-size="27" font-weight="700" fill="#23705b">P1 的数据内容</text><rect x="56" y="330" width="766" height="88" rx="16" fill="#ffffff" stroke="#b9cbe5" stroke-width="2"/><text x="82" y="365" font-size="26" font-weight="700" fill="#25364b">① 写入新 PTE</text><text x="82" y="400" font-size="23" font-weight="400" fill="#25364b">G 所在页 → DMA/IOVA 0x1234_6000</text><line x1="439" y1="418" x2="439" y2="450" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="56" y="455" width="766" height="88" rx="16" fill="#ffffff" stroke="#b9cbe5" stroke-width="2"/><text x="82" y="490" font-size="26" font-weight="700" fill="#25364b">② 等页表更新完成</text><text x="82" y="525" font-size="23" font-weight="400" fill="#25364b">Walker 再读表时能取得新 PTE</text><line x1="439" y1="543" x2="439" y2="575" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="56" y="580" width="766" height="94" rx="16" fill="#ffffff" stroke="#b9cbe5" stroke-width="2"/><text x="82" y="617" font-size="26" font-weight="700" fill="#25364b">③ 请求并确认翻译失效</text><text x="82" y="654" font-size="23" font-weight="400" fill="#25364b">PASID 42；相关 Hub 的旧翻译不能再命中</text><rect x="878" y="330" width="766" height="105" rx="16" fill="#ffffff" stroke="#b9dfd4" stroke-width="2"/><text x="904" y="367" font-size="26" font-weight="700" fill="#25364b">① 在 P1 准备 Packet 37</text><text x="904" y="405" font-size="23" font-weight="400" fill="#25364b">P1：system RAM 的 Host PA 页 0x4567_9000</text><line x1="1261" y1="435" x2="1261" y2="480" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="878" y="485" width="766" height="105" rx="16" fill="#ffffff" stroke="#b9dfd4" stroke-width="2"/><text x="904" y="522" font-size="26" font-weight="700" fill="#25364b">② 按读取方协议发布内容</text><text x="904" y="560" font-size="23" font-weight="400" fill="#25364b">CP/MEC 能从 P1 读到正确的 Packet 字节</text><line x1="439" y1="674" x2="439" y2="735" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><line x1="1261" y1="590" x2="1261" y2="735" stroke="#4376b8" stroke-width="4" marker-end="url(#arrow)"/><rect x="56" y="740" width="1588" height="114" rx="16" fill="#e7f3ec" stroke="#aed5bd" stroke-width="2"/><text x="82" y="783" font-size="29" font-weight="700" fill="#1c5d42">两个分支都完成 → 恢复对 G 的读取</text><text x="82" y="826" font-size="25" font-weight="400" fill="#25364b">G=0x1000_0940 → DMA/IOVA 0x1234_6940 → P1 的 Host PA 0x4567_9940</text><text x="56" y="905" font-size="23" font-weight="500" fill="#53657f">P0 另行释放：还要确认其他使用者结束，相关 GPU 与 DMA/IOMMU 映射已按协议撤销。</text></g></svg>