<text x="44" y="505" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#18344f">C [2] = SNOOPED：访问 PTB 的一致性属性。</text>
<text x="640" y="505" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#18344f">S [1] = SYSTEM：0 本地内存，1 系统内存。</text>
<text x="44" y="542" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#18344f">V [0] = VALID：本图要求为有效项。</text>
<text x="640" y="542" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#18344f">[11:6] 属于表地址，不能当 FRAG / 写权限。</text>
