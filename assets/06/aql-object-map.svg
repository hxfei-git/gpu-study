<text x="65" y="936" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#087a78">代码对象（本例后备在 HBM）</text>
<text x="65" y="976" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">Descriptor 0x7000_0000</text>
<text x="65" y="1008" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">入口偏移 +0x100</text>
<text x="65" y="1040" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">机器码 0x7000_0100</text>
<rect x="490" y="920" width="375" height="190" rx="14" fill="#eff5fb" stroke="#285b8f" stroke-width="2"/>
<text x="510" y="936" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#285b8f">Kernarg（system RAM）</text>
<text x="510" y="976" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">参数块 0x6000_0000</text>
<text x="510" y="1008" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">保存 A/B/C 的 GPUVA</text>
<text x="510" y="1040" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">以及 N = 1024</text>
