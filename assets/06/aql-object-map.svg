<text x="680.0" y="32" text-anchor="middle" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#172b42">同一进程的管理关系与 Packet 的对象引用</text>
<text x="680.0" y="86" text-anchor="middle" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#54677a">本例地址均为 GPUVA；管理对象、后备存储和硬件上下文分别解释</text>
