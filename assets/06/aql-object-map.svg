<rect x="65" y="635" width="1220" height="180" rx="14" fill="#eff5fb" stroke="#285b8f" stroke-width="2"/>
<text x="85" y="651" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#285b8f">Packet 37：GPUVA 0x1000_0940</text>
<text x="85" y="691" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">kernel_object 引用执行描述；kernarg_address 引用参数块；completion_signal 保存句柄 S</text>
<text x="85" y="723" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">Grid = 1024；Work-group = 256；一个 Packet 描述这一次 Dispatch</text>
