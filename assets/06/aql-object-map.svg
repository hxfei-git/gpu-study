<text x="770" y="441" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">独立 Ring / MQD / Doorbell 槽位</text>
<text x="770" y="473" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">100 等 S；101 通过参数引用 C</text>
