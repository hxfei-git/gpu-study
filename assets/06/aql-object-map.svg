<text x="455" y="1266" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">A：0x3000_0000</text>
<text x="455" y="1298" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">B：0x4000_0000</text>
<text x="455" y="1330" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">C：0x5000_0000</text>
<text x="680" y="1456" text-anchor="middle" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#54677a">所有 GPUVA 按 P 的 GPUVM 解释；C、参数和 S 的保留条件由各自使用者决定。</text>
