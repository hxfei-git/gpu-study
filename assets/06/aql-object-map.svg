<text x="85" y="441" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">Ring、索引、MQD、Doorbell 槽位</text>
<text x="85" y="473" text-anchor="start" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#172b42">Ring 基址 0x1000_0000</text>
