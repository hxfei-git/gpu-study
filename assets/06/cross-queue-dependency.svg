<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52677d"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="48" y="56" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#20344c">Q1 准备 A → Q0 计算 C → Host 校验</text>
<text x="48" y="95" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#52677d">从发布前重新推演的独立案例 · 同一 P / GPU Agent · S_ready = 1，S = 1</text>
<rect x="50" y="134" width="1100" height="126" rx="14" fill="#f2f6fa" stroke="#c5d4df" stroke-width="1.5"/>
<text x="72" y="171" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#285f90">Host 已准备 Queue、代码、映射、两份 Kernarg 和 B</text>
<text x="72" y="211" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">B[i] = 10 × (i + 1)；按发布协议提交 Q1 / 12 与 Q0 / 36、37</text>
<text x="72" y="243" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#52677d">起点：Q0 下一编号 36，Q1 下一编号 12；未重复使用旧 Packet ID</text>
<path d="M335 260L335 310" fill="none" stroke="#52677d" stroke-width="2.4" marker-end="url(#arr)"/>
<path d="M875 260L875 310" fill="none" stroke="#52677d" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="50" y="311" width="530" height="345" rx="14" fill="#eaf4ee" stroke="#c5d4df" stroke-width="1.5"/>
<text x="72" y="348" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#247054">Q1 / Packet 12：prepare_A</text>
<text x="72" y="388" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">启动：SYSTEM acquire</text>
<text x="72" y="422" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">执行：写 A[i] = i + 1</text>
<text x="72" y="456" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">完成：SYSTEM release</text>
<text x="72" y="490" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">然后更新 S_ready：1 → 0</text>
<rect x="640" y="311" width="510" height="345" rx="14" fill="#f2f6fa" stroke="#c5d4df" stroke-width="1.5"/>
<text x="662" y="348" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#285f90">Q0 / Packet 36：Barrier-AND</text>
<text x="662" y="388" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">dep_signal[0] = S_ready</text>
<text x="662" y="422" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">S_ready 为 1：等待，37 不能启动</text>
<text x="662" y="456" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">依赖满足后：SYSTEM acquire / release</text>
<text x="662" y="490" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">本例 completion_signal 为空</text>
<path d="M580 576L640 576" fill="none" stroke="#52677d" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="586" y="560" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#52677d">依赖</text>
<text x="77" y="627" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#247054">完成信号位于 Ring 外；12 更新其值。</text>
<path d="M895 656L895 710" fill="none" stroke="#52677d" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="682" y="690" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#52677d">Barrier 完成后放行</text>
<rect x="640" y="711" width="510" height="248" rx="14" fill="#f2f6fa" stroke="#c5d4df" stroke-width="1.5"/>
<text x="662" y="748" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#285f90">Q0 / Packet 37：vector_add</text>
<text x="662" y="788" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">启动：SYSTEM acquire</text>
<text x="662" y="822" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">执行：读 A/B，写 C[i] = A[i] + B[i]</text>
<text x="662" y="856" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">完成：SYSTEM release</text>
<text x="662" y="890" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">然后更新 S：1 → 0</text>
<rect x="50" y="711" width="530" height="248" rx="14" fill="#fff8ee" stroke="#c5d4df" stroke-width="1.5"/>
<text x="72" y="748" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#976126">这次等待的两个约束</text>
<text x="72" y="788" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">Barrier 类型：阻挡同 Queue 后继 37</text>
<text x="72" y="822" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">Header barrier bit：另管本 Queue 前序</text>
<text x="72" y="856" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">本例两个 bit 可为 0，依赖仍由 36 保证</text>
<text x="72" y="890" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">S_ready 保持 0，直到 Barrier 用完</text>
<path d="M895 959L895 1015L600 1015L600 1054" fill="none" stroke="#52677d" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="274" y="993" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#52677d">S 更新以后，Host 才能确认最终完成</text>
<rect x="50" y="1055" width="1100" height="187" rx="14" fill="#eaf4ee" stroke="#c5d4df" stroke-width="1.5"/>
<text x="72" y="1092" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#247054">Host：acquire 等待 S 满足条件，再读取 C</text>
<text x="72" y="1132" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">确认任务：本轮 S = 0，且未混用其他轮次或错误状态</text>
<text x="72" y="1166" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">读取条件：配对同步已满足，C 的映射和存储仍有效</text>
<text x="72" y="1200" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">检查数值：1024 项均为 11 × (i + 1)，例如 C[0] = 11、C[5] = 66</text>
<path d="M600 1242L600 1288" fill="none" stroke="#52677d" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="50" y="1289" width="1100" height="161" rx="14" fill="#f2f6fa" stroke="#c5d4df" stroke-width="1.5"/>
<text x="72" y="1326" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#285f90">所有使用者结束后，再复用或释放</text>
<text x="72" y="1366" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">A 保留到 37 用完；S_ready 保留到 36 用完；C 保留到 Host / 后续消费者用完</text>
<text x="72" y="1400" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#20344c">本例在最终 S 完成、Host 校验结束且无其他使用者后，统一回收本轮资源</text>
<text x="60" y="1500" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#52677d">顺序来自依赖与同步协议；Host 两次提交的先后和间隔本身不提供跨 Queue 依赖。</text>
<text x="60" y="1537" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#52677d">示意图不按执行时间比例绘制；没有把依赖等待画成占用 CU 的轮询 Kernel。</text>
</svg>
