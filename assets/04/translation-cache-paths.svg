<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1074" viewBox="0 0 1440 1074"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#536b83" stroke-width="1.5"/></marker></defs><rect width="1440" height="1074" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#21364b}.num{font-family:Consolas,"Microsoft YaHei",monospace}.muted{fill:#536b83}.title{font-weight:700}</style><text x="30" y="44" font-size="32" class="title">同一个地址：缓存命中后，还要做哪些查表工作？</text><text x="30" y="81" font-size="24" class="muted">教学对照：同一 GPUVM，映射有效且未改变；各栏表示不同的缓存状态。</text><rect x="24" y="102" width="1392" height="82" rx="12" fill="#f4f7fa" stroke="#cddae7"/><text x="46" y="137" font-size="25" class="num">请求：0x1000_1940     索引：(0, 0, 128, 1)     页内偏移：0x940</text><text x="46" y="170" font-size="22" class="">第二页目标基址：Dnext = 0x2345_6000；左栏已缓存该结果，中、右栏仍需读取 PTB[1]。</text><rect x="24" y="205" width="448" height="793" rx="12" fill="#fbfcfe" stroke="#cddae7"/><rect x="496" y="205" width="448" height="793" rx="12" fill="#fbfcfe" stroke="#cddae7"/><rect x="968" y="205" width="448" height="793" rx="12" fill="#fbfcfe" stroke="#cddae7"/><text x="44" y="245" font-size="27" class="title">最终翻译命中</text><text x="44" y="279" font-size="22" class="muted">查找键：虚拟页及地址空间</text><text x="516" y="245" font-size="27" class="title">按表项地址缓存</text><text x="516" y="279" font-size="22" class="muted">查找键：表项自身的存放地址</text><text x="988" y="245" font-size="27" class="title">按 VA 前缀缓存</text><text x="988" y="279" font-size="22" class="muted">查找键：前几段索引及地址空间</text><rect x="40" y="305" width="416" height="140" rx="12" fill="#eaf3ff" stroke="#9bbbe1"/><text x="58" y="337" font-size="24" class="title">查 TLB → 命中</text><text x="58" y="370" font-size="22" class="num">虚拟页：0x1000_1000</text><text x="58" y="400" font-size="22" class="num">目标页：0x2345_6000</text><text x="58" y="430" font-size="22" class="num">范围：4 KiB</text><path d="M 248 455 V 477 H 60 V 707 H 248 V 719" stroke="#536b83" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="82" y="523" font-size="25" class="title">已经得到目标数据页</text><text x="82" y="562" font-size="21" class="num">PDB2 / PDB1 / PDB0 / PTB</text><text x="82" y="594" font-size="23" class="">四次表项查询都可以省去</text><rect x="512" y="305" width="416" height="108" rx="12" fill="#eaf3ff" stroke="#9bbbe1"/><text x="530" y="337" font-size="24" class="title">用 R2 + 0 × 8 查目录缓存</text><text x="530" y="370" font-size="22" class="num">0x8000_0000 → 命中</text><text x="530" y="400" font-size="22" class="num">得到 R1 = 0x8000_1000</text><path d="M 720 418 V 439" stroke="#536b83" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="512" y="446" width="416" height="108" rx="12" fill="#eaf3ff" stroke="#9bbbe1"/><text x="530" y="478" font-size="24" class="title">用 R1 + 0 × 8 查目录缓存</text><text x="530" y="511" font-size="22" class="num">0x8000_1000 → 命中</text><text x="530" y="541" font-size="22" class="num">得到 R0 = 0x8000_2000</text><path d="M 720 559 V 580" stroke="#536b83" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="512" y="587" width="416" height="108" rx="12" fill="#eaf3ff" stroke="#9bbbe1"/><text x="530" y="619" font-size="24" class="title">用 R0 + 128 × 8 查目录缓存</text><text x="530" y="652" font-size="22" class="num">0x8000_2400 → 命中</text><text x="530" y="682" font-size="22" class="num">得到 RT = 0x8000_3000</text><path d="M 720 700 V 721" stroke="#536b83" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="984" y="305" width="416" height="140" rx="12" fill="#eaf3ff" stroke="#9bbbe1"/><text x="1002" y="337" font-size="24" class="title">用 (0, 0, 128) 查缓存</text><text x="1002" y="370" font-size="22" class="">最长前缀命中</text><text x="1002" y="400" font-size="22" class="num">直接得到 RT = 0x8000_3000</text><text x="1002" y="430" font-size="22" class="num">不必先取得 R1、R0</text><path d="M 1192 455 V 477 H 1388 V 708 H 1192 V 721" stroke="#536b83" fill="none" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1022" y="535" font-size="26" class="title">跳过前面三级的查询</text><text x="1022" y="577" font-size="23" class="">接着读取最后一级表项</text><rect x="40" y="734" width="416" height="118" rx="12" fill="#e9f7ee" stroke="#9dceb0"/><text x="58" y="766" font-size="24" class="title">组合原请求的页内偏移</text><text x="58" y="799" font-size="22" class="num">0x2345_6000 + 0x940</text><text x="58" y="829" font-size="22" class="num">= 0x2345_6940</text><rect x="512" y="734" width="416" height="118" rx="12" fill="#fff5df" stroke="#dfc58b"/><text x="530" y="766" font-size="24" class="title">读取 PTB[1] 的 descriptor</text><text x="530" y="799" font-size="22" class="num">表项地址：0x8000_3008</text><text x="530" y="829" font-size="22" class="num">解出 Dnext = 0x2345_6000</text><rect x="984" y="734" width="416" height="118" rx="12" fill="#fff5df" stroke="#dfc58b"/><text x="1002" y="766" font-size="24" class="title">读取 PTB[1] 的 descriptor</text><text x="1002" y="799" font-size="22" class="num">表项地址：0x8000_3008</text><text x="1002" y="829" font-size="22" class="num">解出 Dnext = 0x2345_6000</text><text x="49" y="895" font-size="24" class="title">后续取表项：0 次</text><text x="529" y="895" font-size="24" class="title">后续取表项：1 次</text><text x="1001" y="895" font-size="24" class="title">后续取表项：1 次</text><text x="49" y="937" font-size="22" class="">直接进入数据访问</text><text x="529" y="937" font-size="22" class="">之前还有 3 次串行缓存查询</text><text x="1001" y="937" font-size="22" class="">之前无需逐级取得 R1、R0</text><text x="30" y="1035" font-size="24" class="">中、右栏取得 Dnext 后，也加上 0x940，得到相同的目标 DMA 地址 0x2345_6940。</text><text x="30" y="1065" font-size="20" class="muted">“后续取表项”指向专用页表缓存之外取表项，不直接等同于 HBM 事务数；图中距离不代表时钟周期。</text></svg>
